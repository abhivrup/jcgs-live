            (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
          if (!standalone) return;
          if (window.top === window.self) {
            try { sessionStorage.removeItem("jcgs-standalone-promote"); } catch (e) {}
            return;
          }
          var done = false;
          try { done = sessionStorage.getItem("jcgs-standalone-promote") === "1"; } catch (e) {}
          if (done) return;
          try { sessionStorage.setItem("jcgs-standalone-promote", "1"); } catch (e) {}
          window.top.location.replace(window.location.href);
        } catch (e) { /* stay framed rather than break the page */ }
      })();

    <script>
    "use strict";
    /* ============================ channel ============================ */
    var CHANNEL_ID = "UC1C7YIULB-Rj-9A1l62ajrA";
    var UPLOADS_PLAYLIST = "UU1C7YIULB-Rj-9A1l62ajrA"; /* channel uploads = UU + channel id minus UC */
    var STREAMS_PLAYLIST = "UULV1C7YIULB-Rj-9A1l62ajrA"; /* "Live streams" — the channel's stream recordings */
    var SHORTS_PLAYLIST = "UUSH1C7YIULB-Rj-9A1l62ajrA"; /* "Short videos" — the channel's shorts */
    var URL_LIVE = "https://m.youtube.com/@JCGSLive/live";
    var URL_HOME = "https://m.youtube.com/@JCGSLive";
    var URL_STREAMS = "https://m.youtube.com/@JCGSLive/streams";
    var URL_PLAYLISTS = "https://m.youtube.com/@JCGSLive/playlists";
    var CHANNEL_NAME = "Jain Center of Greater Sacramento";

    function $(id) { return document.getElementById(id); }
    function fmtTime(sec) {
      if (!isFinite(sec) || sec < 0) sec = 0;
      var m = Math.floor(sec / 60), s = Math.floor(sec % 60);
      return m + ":" + (s < 10 ? "0" : "") + s;
    }
    function openExternal(url) { window.open(url, "_blank"); }

    /* ============================ click sound ============================ */
    var audioCtx = null;
    function click() {
      try {
        if (!audioCtx) {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          audioCtx = new AC();
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = "square";
        osc.frequency.value = 2100;
        gain.gain.setValueAtTime(0.025, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.018);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.02);
      } catch (e) { /* garnish only */ }
    }

    /* ============================ navigation ============================ */
    var stack = [{ kind: "menu" }];
    var selections = {};
    function screen() { return stack[stack.length - 1]; }
    function getSel() { return selections[screen().kind] || 0; }
    function setSel(i) { selections[screen().kind] = i; render(); }
    function push(s) { stack.push(s); render(); }
    function pop() { if (stack.length > 1) stack.pop(); render(); }
    function gotoNowPlaying() { if (screen().kind !== "nowPlaying") push({ kind: "nowPlaying" }); }

    /* ============================ playback ============================ */
    var mode = null;            /* "live" | "videos" | "shorts" | "streams" | "playlist" */
    var activePlaylistId = null, activePlaylistTitle = "";
    var isPlaying = false, volume = 80;
    var progress = { t: 0, d: 0 };
    var videoTitle = "";
    var player = null, apiReady = false, pendingMode = null;
    var liveVideoId = null;      /* video id of the channel's current live stream, resolved at runtime */
    var liveFallbackDone = false; /* true once a failed live embed has fallen back to YouTube */

    window.onYouTubeIframeAPIReady = function () {
      apiReady = true;
      if (pendingMode) { var m = pendingMode; pendingMode = null; startMode(m); }
      if (eventsLoadPending) { eventsLoadPending = false; startHarvest(); }
      if (liveResolvePending) { liveResolvePending = false; startLive(); }
    };
    (function loadApi() {
      if (window.YT && window.YT.Player) { apiReady = true; return; }
      var tag = document.createElement("script");
      tag.src = "https://www.youtube.com/iframe_api";
      tag.async = true;
      document.head.appendChild(tag);
    })();

    /* ==================== Live Darshan (embedded) ====================
       The "Live Darshan / Event" item plays the channel's live stream
       embedded in Now Playing. Which video is live changes whenever the
       stream restarts, so the current one is resolved at runtime from
       the channel's "Live streams" playlist — harvested by exactly the
       machinery that powers the JCGS Events list below. The playlist
       is ordered newest-first by stream START, so the live video is
       NOT reliably its first entry: the long-running 24/7 darshan
       sits behind recent event recordings in the list, and playing
       the first ID deterministically replays a recent past stream
       (exactly the bug reported). Instead, the first few harvested
       IDs are probed in the offscreen harvest player (see
       probeLiveCandidate): a video that is live right now reports
       getDuration() === 0 in the IFrame API, while every finished
       recording reports its real length. Only the entry that probes
       live is played, loaded in the main player by ID, exactly like
       any other single video. If none of the probed entries is live,
       the tap falls back to YouTube — a past recording is never
       presented as the live darshan.
       Resolution is always fresh at tap time (see startLive): stream
       IDs cached by an earlier Events visit, and whatever the main
       player currently holds, are never trusted for Live — trusting
       them is what made Live Darshan replay the last played video.
       Entering live mode also always rebuilds the player around the
       resolved ID (see sourceKey), so a stale source can never keep
       playing in place of the darshan.
       The live_stream?channel= embed URL is deliberately never used:
       it answers "Video unavailable" / Error 153 in every direct test,
       even though the live video itself embeds fine by ID (verified
       with a plain embed of the live video on this app's own origin).
       If no live ID can be resolved — nothing live, or the harvest
       failed — the item goes straight to the external fallback, the
       live page on YouTube, with no intermediate error screen. The
       same fallback runs if the main player errors on the live embed
       after starting (see liveEmbedFailed).
       Leaving Live is a full teardown, not just a screen change:
       backing out of the live Now Playing screen (MENU) or picking
       any other section stops and destroys the main player AND the
       harvest/probe player and cancels every probe/harvest timer
       (see teardownLivePlayback / cancelLiveWork), so the next
       section always builds a completely clean player. A Live →
       Shorts switch previously surfaced YouTube's generic "An error
       occurred. Please try again later." playback error in the
       fresh Shorts player, with live's leftover players/timers the
       prime suspect; nothing live-related may linger.
       Autoplay: resolution takes seconds after the tap, so the
       loaded stream does not always start on its own (it sits
       behind the player's play button, worst on phones) — the
       embed asks for autoplay and an explicit playVideo()
       watchdog drives it until it is playing; see armAutoplay,
       which since the "opens but does not play" report now covers
       every section, not just Live. */
    var liveResolvePending = false;  /* Live tapped before the API was ready */
    var liveAwaitingIds = false;     /* streams-playlist harvest in flight for Live */
    var liveResolving = false;       /* a live resolution (harvest + probe) is in flight */

    /* Bumped on every live entry and folded into live mode's source
       key (see sourceKey), so entering Live Darshan always rebuilds
       the player and no previously loaded source can continue in its
       place — not even when re-entering Live for the same stream. */
    var liveSeq = 0;
    /* Autoplay watchdog (all sections). A freshly loaded video
       does not always start on its own: by the time the player has
       loaded it, the viewer's tap may no longer count as a fresh
       user gesture (Live's resolution takes seconds; on phones the
       embed's autoplay=1 alone is unreliable everywhere), and the
       player leaves the video cued/paused behind its big play
       button — the video "opens but does not play" until the
       viewer presses play. The embeds therefore carry autoplay=1
       (see makeYtIframe), every load path calls playVideo()
       explicitly, and for ~10s after a load (or a next/previous
       skip) this watchdog checks the player state twice a second
       and calls playVideo() whenever the video is sitting cued,
       paused, or unstarted. It stands down the moment the video is
       playing or buffering, when the player is destroyed, or when
       the viewer pauses on purpose (see togglePlay). */
    var autoplayTimer = null;
    function armAutoplay() {
      disarmAutoplay();
      var tries = 0;
      autoplayTimer = setInterval(function () {
        tries++;
        if (!mode || !player) { disarmAutoplay(); return; }
        var st = -1;
        try { st = player.getPlayerState(); } catch (e) {}
        if (st === 1 || st === 3) { disarmAutoplay(); return; } /* playing / buffering — done */
        if (st === 5 || st === 2 || st === -1) { try { player.playVideo(); } catch (e) {} }
        if (tries >= 20) disarmAutoplay();
      }, 500);
    }
    function disarmAutoplay() {
      if (autoplayTimer) { clearInterval(autoplayTimer); autoplayTimer = null; }
    }
    function playLive(id, title) {
      /* No resolved ID — straight to the external fallback. Live
         Darshan must never fall back to whatever the player happens
         to have loaded already. */
      if (!id) { openExternal(URL_LIVE); return; }
      liveVideoId = id;
      liveSeq++;
      liveFallbackDone = false;

      { id: "PL5t7q6tYTze7CfoP01DB1CdgfLufZ_AvK", title: "JCGS Diwali 2025" },
      { id: "PL5t7q6tYTze7SACkuV9SDP6cWRQlAj0xp", title: "JCGS 1st Anniversary 2024" },
      { id: "PL5t7q6tYTze6tZ3Fn3bSpEBLKhbP0EcFs", title: "NY Jain Sangh Visit" },
      { id: "PL5t7q6tYTze7deDbWSCAV1Ml1InjCXGKQ", title: "Live Darshan" },
      { id: "PL5t7q6tYTze4sC9xQhwYtpqHSKqAVjupZ", title: "Paryushan Mahaparva 2024" },
      { id: "PL5t7q6tYTze7QvT4CrYN6nmJ7s3Kfgpw4", title: "Guruji Narendrabhai Koradia Visit 2024" },
      { id: "PL5t7q6tYTze4zmoyaFcfu-xFVRH_-RZCq", title: "Mahavir Janma Kalyanak 2024" },
      { id: "PL5t7q6tYTze57sqBXgSv3JffDSb428gXE", title: "Visitors" },
      { id: "PL5t7q6tYTze4_NF-qzXkKiCz93z48EPHG", title: "Cha Gau Yatra 2024" },
      { id: "PL5t7q6tYTze6BawXow52SJ_8N4zram4zX", title: "Srimad Rajchandraji Pratishtha Mohotsav 2024" },
      { id: "PL5t7q6tYTze6Zyz6KBaU8K8vyVK92KCzo", title: "Grand Pratishtha Mahotsav 2023" }
    ];

    function openPlaylistsList() {
      if (!channelPlaylists.length) { openExternal(URL_PLAYLISTS); return; }
      /* Same abandoned-resolution guard as openEventsList. */
      cancelLiveWork();
      push({ kind: "playlists" });
    }
    function playPlaylist(pl) {
      activePlaylistId = pl.id;
      activePlaylistTitle = pl.title;
      startMode("playlist");
    }

    setInterval(function () {
      if (screen().kind !== "nowPlaying" || !player) return;
      try {
        progress = { t: player.getCurrentTime() || 0, d: player.getDuration() || 0 };
        refreshVideoMeta();
        renderNowPlaying();
      } catch (e) { /* not ready */ }
    }, 500);

    /* ============================ menu model ============================ */
    function buildItems() {
      if (screen().kind === "playlists") {
        if (!channelPlaylists.length) return [{ label: "No playlists", action: function () {} }];
        return channelPlaylists.map(function (pl) {
          return {
            label: pl.title,
            chevron: true,
            action: function () { playPlaylist(pl); }
          };
        });
      }
      if (screen().kind === "events") {
        if (!streamIds) return [{ label: "Loading events…", action: function () {} }];
        return streamIds.map(function (id, i) {
          return {
            label: streamTitles[id] || "Loading…",
            action: function () { playStreamAt(i); }
          };
        });
      }
      if (screen().kind !== "menu") return null;
      return [
        { label: "Live Darshan / Event", chevron: true, action: function () { startLive(); } },
        { label: "Videos", chevron: true, action: function () { startMode("videos"); } },
        { label: "Shorts", chevron: true, action: function () { startMode("shorts"); } },
        { label: "JCGS Events", chevron: true, action: function () { openEventsList(); } },
        { label: "Playlists", chevron: true, action: function () { openPlaylistsList(); } },
        { label: "YouTube", right: "Open", action: function () { openExternal(URL_HOME); } },
        { label: "Now Playing", chevron: true, action: function () { push({ kind: "nowPlaying" }); } }
      ];
    }

    /* ============================ rendering ============================ */
    var VISIBLE_ROWS = 7;
    var currentItems = null;

    function render() {
      var s = screen();
      var isNP = s.kind === "nowPlaying";
      $("playerHost").classList.toggle("hidden", !isNP);
      $("listScreen").classList.toggle("hidden", isNP);
      $("npOverlay").classList.toggle("hidden", !isNP);
      syncPlayingUi();
      if (isNP) { renderNowPlaying(); return; }
      $("lcdTitle").textContent = s.kind === "events" ? "JCGS Events" : (s.kind === "playlists" ? "Playlists" : "JCGS YouTube App");
      $("menuNote").classList.toggle("hidden", s.kind !== "menu");
      currentItems = buildItems();
      var rowsEl = $("rows");
      rowsEl.innerHTML = "";
      var sel = Math.min(getSel(), currentItems.length - 1);
      /* Window the rows so the highlight stays on screen in long lists
         (the events list); the 7-item menu always fits whole. */
      var winStart = s.winStart || 0;
      if (sel < winStart) winStart = sel;
      if (sel > winStart + VISIBLE_ROWS - 1) winStart = sel - VISIBLE_ROWS + 1;
      winStart = Math.max(0, Math.min(winStart, Math.max(0, currentItems.length - VISIBLE_ROWS)));
      s.winStart = winStart;
      currentItems.slice(winStart, winStart + VISIBLE_ROWS).forEach(function (item, vi) {
        var idx = winStart + vi;
        var row = document.createElement("div");
        row.className = "row" + (idx === sel ? " active" : "");
        row.style.height = (100 / VISIBLE_ROWS) + "%";
        row.setAttribute("role", "button");
        row.setAttribute("aria-label", item.label);
        var lbl = document.createElement("span"); lbl.className = "lbl"; lbl.textContent = item.label;
        row.appendChild(lbl);
        if (item.right) {
          var r = document.createElement("span"); r.className = "right"; r.textContent = item.right;
          row.appendChild(r);
        }
        if (item.chevron) { var c = document.createElement("span"); c.className = "chev"; c.textContent = "›"; row.appendChild(c); }
        row.addEventListener("click", function () { selections[screen().kind] = idx; click(); item.action(); });
        rowsEl.appendChild(row);
      });
    }

    function renderNowPlaying() {
      var isLive = mode === "live";
      var hasSource = !!mode;
      $("npTitle").textContent = hasSource ? videoTitle : "Nothing Playing";
      var sub = $("npSub");
      if (!hasSource) {
        sub.textContent = "Pick Videos from the menu";
      } else if (isLive) {
        sub.innerHTML = "";
        var badge = document.createElement("span"); badge.className = "np-live"; badge.textContent = "LIVE";
        sub.appendChild(badge);
        sub.appendChild(document.createTextNode(CHANNEL_NAME));
      } else {
        var pos = "";
        try {
          if (player && player.getPlaylistIndex) {
            var idx = player.getPlaylistIndex();
            var list = player.getPlaylist ? player.getPlaylist() : null;
            if (idx >= 0 && list && list.length) pos = " · Video " + (idx + 1) + " of " + list.length;
          }
        } catch (e) { /* not ready */ }
        sub.textContent = CHANNEL_NAME + pos + " · Vol " + volume + "%";
      }
      $("npProgress").classList.toggle("hidden", !hasSource);
      if (hasSource) {
        if (isLive) {
          $("npCur").textContent = "LIVE";
          $("npRem").textContent = "";
          $("npFill").style.width = "100%";
        } else {
          $("npCur").textContent = fmtTime(progress.t);
          $("npRem").textContent = "-" + fmtTime(Math.max(0, progress.d - progress.t));
          $("npFill").style.width = (progress.d > 0 ? Math.min(100, progress.t / progress.d * 100) : 0) + "%";
        }
        $("npState").textContent = isPlaying ? "❚❚" : "▶";
      }
    }
    function syncPlayingUi() {
      $("playingIcon").classList.toggle("hidden", !isPlaying);
      $("playGlyph").innerHTML = isPlaying
        ? '<svg viewBox="0 0 30 16" fill="currentColor" aria-hidden="true" style="width:8cqw;height:4.4cqw"><path d="M9 1h5v14H9zM18 1h5v14h-5z"/></svg>'
        : '<svg viewBox="0 0 30 16" fill="currentColor" aria-hidden="true" style="width:8cqw;height:4.4cqw"><path d="M4 1l9 7-9 7z"/><path d="M17 1h3.4v14H17zM23 1h3.4v14H23z"/></svg>';
      if (screen().kind === "nowPlaying") renderNowPlaying();
    }

    /* ============================ wheel ============================ */
    var SCROLL_STEP_DEG = 22;
    var wheel = $("wheel");
    var gesture = null, lastTapAt = 0;

    function angleAt(x, y) {
      var r = wheel.getBoundingClientRect();
      return Math.atan2(y - (r.top + r.height / 2), x - (r.left + r.width / 2)) * 180 / Math.PI;
    }
    wheel.addEventListener("pointerdown", function (e) {
      if (gesture) return;
      if (e.target === $("centerBtn")) return;
      try { wheel.setPointerCapture(e.pointerId); } catch (err) {}
      gesture = { id: e.pointerId, last: angleAt(e.clientX, e.clientY), acc: 0, total: 0, x: e.clientX, y: e.clientY };
    });
    wheel.addEventListener("pointermove", function (e) {
      if (!gesture || e.pointerId !== gesture.id) return;
      var a = angleAt(e.clientX, e.clientY);
      var d = a - gesture.last;
      if (d > 180) d -= 360;
      if (d < -180) d += 360;
      gesture.last = a; gesture.acc += d; gesture.total += Math.abs(d);
      while (gesture.acc >= SCROLL_STEP_DEG) { gesture.acc -= SCROLL_STEP_DEG; onScrollStep(1); }
      while (gesture.acc <= -SCROLL_STEP_DEG) { gesture.acc += SCROLL_STEP_DEG; onScrollStep(-1); }
    });
    function endGesture(e) {
      if (!gesture || e.pointerId !== gesture.id) return;
      var g = gesture; gesture = null;
      var moved = Math.hypot(e.clientX - g.x, e.clientY - g.y);
      if (g.total > 14 || moved > 12) return;
      var r = wheel.getBoundingClientRect();
      var dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
      if (Math.hypot(dx, dy) < r.width * 0.19) return;
      var a = Math.atan2(dy, dx) * 180 / Math.PI;
      lastTapAt = Date.now();
      if (a >= -135 && a < -45) onMenuBtn();
      else if (a >= 45 && a < 135) onPlayPause();
      else if (a >= 135 || a < -135) onPrev();
      else onNext();
    }
    wheel.addEventListener("pointerup", endGesture);
    wheel.addEventListener("pointercancel", function () { gesture = null; });

    function zoneClick(action) {
      return function () { if (Date.now() - lastTapAt < 400) return; action(); };
    }
    $("zoneMenu").addEventListener("click", zoneClick(onMenuBtn));
    $("zonePrev").addEventListener("click", zoneClick(onPrev));
    $("zoneNext").addEventListener("click", zoneClick(onNext));
    $("zonePlay").addEventListener("click", zoneClick(onPlayPause));
    $("centerBtn").addEventListener("pointerdown", function (e) { e.stopPropagation(); });
    $("centerBtn").addEventListener("pointerup", function (e) { e.stopPropagation(); });
    $("centerBtn").addEventListener("click", function (e) { e.stopPropagation(); onCenter(); });

    function moveSelection(dir) {
      if (!currentItems || !currentItems.length) return;
      setSel(Math.min(Math.max(getSel() + dir, 0), currentItems.length - 1));
      if (screen().kind === "events") ensureTitlesNear(getSel());
    }
    function onScrollStep(dir) {
      if (screen().kind === "nowPlaying") {
        if (mode) {
          volume = Math.min(100, Math.max(0, volume + dir * 4));
          if (player) { try { player.setVolume(volume); } catch (e) {} }
          click(); renderNowPlaying();
        }
        return;
      }
      click();
      moveSelection(dir);
    }
    function onCenter() {
      click();
      if (screen().kind === "nowPlaying") { togglePlay(); return; }
      var item = currentItems && currentItems[getSel()];
      if (item) item.action();
    }
    function onMenuBtn() {
      click();
      /* MENU is also the way out of the pseudo-fullscreen fallback. */
      if (document.body.classList.contains("pseudo-fs")) { exitPseudoFs(); return; }
      /* Backing out of Live Darshan tears all live playback down
         (see teardownLivePlayback) instead of leaving the live
         player, its probe/harvest machinery, and its timers running
         behind the menu — the next section then starts clean. */
      if (screen().kind === "nowPlaying" && mode === "live") teardownLivePlayback();
      pop();
    }
    /* Next/Previous: on the Now Playing screen they skip tracks; on a
       menu/list screen (e.g. the home page, where nothing is playing yet)
       they move the highlight down/up so the buttons always do something
       visible. */
    function onPrev() {
      click();
      if (screen().kind === "nowPlaying") stepTrack(-1);
      else moveSelection(-1);
    }
    function onNext() {
      click();
      if (screen().kind === "nowPlaying") stepTrack(1);
      else moveSelection(1);
    }
    function onPlayPause() { click(); togglePlay(); }

    document.addEventListener("keydown", function (e) {
      if (e.key === "ArrowDown") { onScrollStep(1); e.preventDefault(); }
      else if (e.key === "ArrowUp") { onScrollStep(-1); e.preventDefault(); }
      else if (e.key === "Enter" || e.key === " ") { onCenter(); e.preventDefault(); }
      else if (e.key === "Escape" || e.key === "Backspace") { onMenuBtn(); e.preventDefault(); }
    });

    render();
    </script>
  </body>

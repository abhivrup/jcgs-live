            (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);

          if (window.top === window.self) {
            try { sessionStorage.removeItem("jcgs-standalone-promote"); } catch (e) {}
            return;
          }
          var done = false;
          try { done = sessionStorage.getItem("jcgs-standalone-promote") === "1"; } catch (e) {}
          if (done) return;
          try { sessionStorage.setItem("jcgs-standalone-promote", "1"); } catch (e) {}
          window.top.location.replace(window.location.href);
        } catch (e) { /* stay framed rather than break the page */ }
      })();

    <script>
    "use strict";
    /* ============================ channel ============================ */
    var CHANNEL_ID = "UC1C7YIULB-Rj-9A1l62ajrA";
    var UPLOADS_PLAYLIST = "UU1C7YIULB-Rj-9A1l62ajrA"; /* channel uploads = UU + channel id minus UC */
    var STREAMS_PLAYLIST = "UULV1C7YIULB-Rj-9A1l62ajrA"; /* "Live streams" — the channel's stream recordings */
    var LIVE_EMBED_URL = "https://www.youtube.com/embed/live_stream?channel=" + CHANNEL_ID;
    var URL_LIVE = "https://m.youtube.com/@JCGSLive/live";
    var URL_HOME = "https://m.youtube.com/@JCGSLive";
    var URL_STREAMS = "https://m.youtube.com/@JCGSLive/streams";
    var URL_PLAYLISTS = "https://m.youtube.com/@JCGSLive/playlists";
    var CHANNEL_NAME = "Jain Center of Greater Sacramento";

    function $(id) { return document.getElementById(id); }
    function fmtTime(sec) {
      if (!isFinite(sec) || sec < 0) sec = 0;
      var m = Math.floor(sec / 60), s = Math.floor(sec % 60);
      return m + ":" + (s < 10 ? "0" : "") + s;
    }
    function openExternal(url) { window.open(url, "_blank"); }

    /* ============================ click sound ============================ */
    var audioCtx = null;
    function click() {
      try {
        if (!audioCtx) {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          audioCtx = new AC();
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = "square";
        osc.frequency.value = 2100;
        gain.gain.setValueAtTime(0.025, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.018);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.02);
      } catch (e) { /* garnish only */ }
    }

    /* ============================ navigation ============================ */
    var stack = [{ kind: "menu" }];
    var selections = {};
    function screen() { return stack[stack.length - 1]; }
    function getSel() { return selections[screen().kind] || 0; }
    function setSel(i) { selections[screen().kind] = i; render(); }
    function push(s) { stack.push(s); render(); }
    function pop() { if (stack.length > 1) stack.pop(); render(); }
    function gotoNowPlaying() { if (screen().kind !== "nowPlaying") push({ kind: "nowPlaying" }); }

    /* ============================ playback ============================ */
    var mode = null;            /* "live" | "videos" | "streams" */
    var isPlaying = false, volume = 80;
    var progress = { t: 0, d: 0 };
    var videoTitle = "";
    var player = null, apiReady = false, pendingMode = null;

    window.onYouTubeIframeAPIReady = function () {
      apiReady = true;
      if (pendingMode) { var m = pendingMode; pendingMode = null; startMode(m); }
    };
    (function loadApi() {
      if (window.YT && window.YT.Player) { apiReady = true; return; }
      var tag = document.createElement("script");
      tag.src = "https://www.youtube.com/iframe_api";
      tag.async = true;
      document.head.appendChild(tag);
    })();

    function startMode(m) {
      mode = m;
      isPlaying = true;
      progress = { t: 0, d: 0 };
      videoTitle = m === "live" ? "JCGS Live" : (m === "streams" ? "JCGS Events" : "JCGS Videos");
      mountPlayer(m);
      gotoNowPlaying();
    }
    function loadSource(target, m) {
      if (m === "live") target.loadVideoByUrl(LIVE_EMBED_URL);
      else if (m === "streams") target.loadPlaylist({ listType: "playlist", list: STREAMS_PLAYLIST, index: 0 });
      else target.loadPlaylist({ listType: "playlist", list: UPLOADS_PLAYLIST, index: 0 });
    }
    function mountPlayer(m) {
      if (!apiReady || !window.YT || !window.YT.Player) { pendingMode = m; return; }
      if (player) {
        /* Same player, new source — no rebuild needed. */
        try {
          loadSource(player, m);
          return;
        } catch (e) { /* fall through and rebuild */ }
      }
      var host = $("playerHost");
      host.innerHTML = "";
      var mount = document.createElement("div");
      mount.style.width = "100%"; mount.style.height = "100%";
      host.appendChild(mount);
      var opts = {
        playerVars: { playsinline: 1, rel: 0, modestbranding: 1 },
        events: {
          onReady: function (e) {
            e.target.setVolume(volume);
            loadSource(e.target, m);
          },
          onStateChange: function (e) {
            if (e.data === 1) { isPlaying = true; syncPlayingUi(); }
            if (e.data === 2) { isPlaying = false; syncPlayingUi(); }
            if (e.data === 0) { isPlaying = false; syncPlayingUi(); }
            refreshVideoMeta();
          }
        }
      };
      player = new window.YT.Player(mount, opts);
    }
    function refreshVideoMeta() {
      if (!player) return;
      try {
        var data = player.getVideoData ? player.getVideoData() : null;
        if (data && data.title) videoTitle = data.title;
      } catch (e) { /* not ready */ }
    }
    function stepTrack(dir) {
      if (!player || (mode !== "videos" && mode !== "streams")) return;
      try {
        if (dir > 0) player.nextVideo(); else player.previousVideo();
        progress = { t: 0, d: 0 };
        isPlaying = true;
        setTimeout(refreshVideoMeta, 600);
        renderNowPlaying(); syncPlayingUi();
      } catch (e) { /* transient */ }
    }
    /* Open the currently playing video on YouTube; falls back to the
       channel page when no specific video is loaded. */
    function openOnYouTube() {
      var url = URL_HOME;
      try {
        var data = player && player.getVideoData ? player.getVideoData() : null;
        if (data && data.video_id) url = "https://www.youtube.com/watch?v=" + data.video_id;
      } catch (e) { /* player not ready — channel page it is */ }
      openExternal(url);
    }
    $("npYtBtn").addEventListener("click", function () { click(); openOnYouTube(); });
    $("fsYtBtn").addEventListener("click", function () { openOnYouTube(); });

    /* Full-screen the LCD (video + overlays together) so the fs-yt jump
       button stays reachable while watching full-screen. */
    $("npFsBtn").addEventListener("click", function () {
      click();
      var el = $("lcd");
      try {
        if (document.fullscreenElement || document.webkitFullscreenElement) {
          if (document.exitFullscreen) document.exitFullscreen();
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        } else if (el.requestFullscreen) el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      } catch (e) { /* fullscreen unsupported here — native player controls still offer it */ }
    });
    function syncFsClass() {
      var fs = document.fullscreenElement || document.webkitFullscreenElement;
      document.body.classList.toggle("fs-active", !!fs);
    }
    document.addEventListener("fullscreenchange", syncFsClass);
    document.addEventListener("webkitfullscreenchange", syncFsClass);

    function togglePlay() {
      if (!player || !mode) return;
      try {
        if (player.getPlayerState() === 1) { player.pauseVideo(); isPlaying = false; }
        else { player.playVideo(); isPlaying = true; }
        syncPlayingUi();
      } catch (e) { /* transient */ }
    }

    setInterval(function () {
      if (screen().kind !== "nowPlaying" || !player) return;
      try {
        progress = { t: player.getCurrentTime() || 0, d: player.getDuration() || 0 };
        refreshVideoMeta();
        renderNowPlaying();
      } catch (e) { /* not ready */ }
    }, 500);

    /* ============================ menu model ============================ */
    function buildItems() {
      if (screen().kind !== "menu") return null;
      return [
        { label: "Live", right: "Open", action: function () { openExternal(URL_LIVE); } },
        { label: "Videos", chevron: true, action: function () { startMode("videos"); } },
        { label: "JCGS Events", right: "Open", action: function () { openExternal(URL_STREAMS); } },
        { label: "Playlists", right: "Open", action: function () { openExternal(URL_PLAYLISTS); } },
        { label: "Channel Home", right: "Open", action: function () { openExternal(URL_HOME); } },
        { label: "Now Playing", chevron: true, action: function () { push({ kind: "nowPlaying" }); } }
      ];
    }

    /* ============================ rendering ============================ */
    var VISIBLE_ROWS = 6;
    var currentItems = null;

    function render() {
      var s = screen();
      var isNP = s.kind === "nowPlaying";
      $("playerHost").classList.toggle("hidden", !isNP);
      $("listScreen").classList.toggle("hidden", isNP);
      $("npOverlay").classList.toggle("hidden", !isNP);
      syncPlayingUi();
      if (isNP) { renderNowPlaying(); return; }
      $("lcdTitle").textContent = "JCGS Live";
      currentItems = buildItems();
      var rowsEl = $("rows");
      rowsEl.innerHTML = "";
      var sel = Math.min(getSel(), currentItems.length - 1);
      currentItems.forEach(function (item, idx) {
        var row = document.createElement("div");
        row.className = "row" + (idx === sel ? " active" : "");
        row.style.height = (100 / VISIBLE_ROWS) + "%";
        row.setAttribute("role", "button");
        row.setAttribute("aria-label", item.label);
        var lbl = document.createElement("span"); lbl.className = "lbl"; lbl.textContent = item.label;
        row.appendChild(lbl);
        if (item.right) {
          var r = document.createElement("span"); r.className = "right"; r.textContent = item.right;
          row.appendChild(r);
        }
        if (item.chevron) { var c = document.createElement("span"); c.className = "chev"; c.textContent = "›"; row.appendChild(c); }
        row.addEventListener("click", function () { selections[screen().kind] = idx; click(); item.action(); });
        rowsEl.appendChild(row);
      });
    }

    function renderNowPlaying() {
      var isLive = mode === "live";
      var hasSource = !!mode;
      $("npTitle").textContent = hasSource ? videoTitle : "Nothing Playing";
      var sub = $("npSub");
      if (!hasSource) {
        sub.textContent = "Pick Videos from the menu";
      } else if (isLive) {
        sub.innerHTML = "";
        var badge = document.createElement("span"); badge.className = "np-live"; badge.textContent = "LIVE";
        sub.appendChild(badge);
        sub.appendChild(document.createTextNode(CHANNEL_NAME));
      } else {
        var pos = "";
        try {
          if (player && player.getPlaylistIndex) {
            var idx = player.getPlaylistIndex();
            var list = player.getPlaylist ? player.getPlaylist() : null;
            if (idx >= 0 && list && list.length) pos = " · Video " + (idx + 1) + " of " + list.length;
          }
        } catch (e) { /* not ready */ }
        sub.textContent = CHANNEL_NAME + pos + " · Vol " + volume + "%";
      }
      $("npProgress").classList.toggle("hidden", !hasSource);
      if (hasSource) {
        if (isLive) {
          $("npCur").textContent = "LIVE";
          $("npRem").textContent = "";
          $("npFill").style.width = "100%";
        } else {
          $("npCur").textContent = fmtTime(progress.t);
          $("npRem").textContent = "-" + fmtTime(Math.max(0, progress.d - progress.t));
          $("npFill").style.width = (progress.d > 0 ? Math.min(100, progress.t / progress.d * 100) : 0) + "%";
        }
        $("npState").textContent = isPlaying ? "❚❚" : "▶";
      }
    }
    function syncPlayingUi() {
      $("playingIcon").classList.toggle("hidden", !isPlaying);
      $("playGlyph").innerHTML = isPlaying
        ? '<svg viewBox="0 0 30 16" fill="currentColor" aria-hidden="true" style="width:8cqw;height:4.4cqw"><path d="M9 1h5v14H9zM18 1h5v14h-5z"/></svg>'
        : '<svg viewBox="0 0 30 16" fill="currentColor" aria-hidden="true" style="width:8cqw;height:4.4cqw"><path d="M4 1l9 7-9 7z"/><path d="M17 1h3.4v14H17zM23 1h3.4v14H23z"/></svg>';
      if (screen().kind === "nowPlaying") renderNowPlaying();
    }

    /* ============================ wheel ============================ */
    var SCROLL_STEP_DEG = 22;
    var wheel = $("wheel");
    var gesture = null, lastTapAt = 0;

    function angleAt(x, y) {
      var r = wheel.getBoundingClientRect();
      return Math.atan2(y - (r.top + r.height / 2), x - (r.left + r.width / 2)) * 180 / Math.PI;
    }
    wheel.addEventListener("pointerdown", function (e) {
      if (gesture) return;
      if (e.target === $("centerBtn")) return;
      try { wheel.setPointerCapture(e.pointerId); } catch (err) {}
      gesture = { id: e.pointerId, last: angleAt(e.clientX, e.clientY), acc: 0, total: 0, x: e.clientX, y: e.clientY };
    });
    wheel.addEventListener("pointermove", function (e) {
      if (!gesture || e.pointerId !== gesture.id) return;
      var a = angleAt(e.clientX, e.clientY);
      var d = a - gesture.last;
      if (d > 180) d -= 360;
      if (d < -180) d += 360;
      gesture.last = a; gesture.acc += d; gesture.total += Math.abs(d);
      while (gesture.acc >= SCROLL_STEP_DEG) { gesture.acc -= SCROLL_STEP_DEG; onScrollStep(1); }
      while (gesture.acc <= -SCROLL_STEP_DEG) { gesture.acc += SCROLL_STEP_DEG; onScrollStep(-1); }
    });
    function endGesture(e) {
      if (!gesture || e.pointerId !== gesture.id) return;
      var g = gesture; gesture = null;
      var moved = Math.hypot(e.clientX - g.x, e.clientY - g.y);
      if (g.total > 14 || moved > 12) return;
      var r = wheel.getBoundingClientRect();
      var dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
      if (Math.hypot(dx, dy) < r.width * 0.19) return;
      var a = Math.atan2(dy, dx) * 180 / Math.PI;
      lastTapAt = Date.now();
      if (a >= -135 && a < -45) onMenuBtn();
      else if (a >= 45 && a < 135) onPlayPause();
      else if (a >= 135 || a < -135) onPrev();
      else onNext();
    }
    wheel.addEventListener("pointerup", endGesture);
    wheel.addEventListener("pointercancel", function () { gesture = null; });

    function zoneClick(action) {
      return function () { if (Date.now() - lastTapAt < 400) return; action(); };
    }
    $("zoneMenu").addEventListener("click", zoneClick(onMenuBtn));
    $("zonePrev").addEventListener("click", zoneClick(onPrev));
    $("zoneNext").addEventListener("click", zoneClick(onNext));
    $("zonePlay").addEventListener("click", zoneClick(onPlayPause));
    $("centerBtn").addEventListener("pointerdown", function (e) { e.stopPropagation(); });
    $("centerBtn").addEventListener("pointerup", function (e) { e.stopPropagation(); });
    $("centerBtn").addEventListener("click", function (e) { e.stopPropagation(); onCenter(); });

    function onScrollStep(dir) {
      if (screen().kind === "nowPlaying") {
        if (mode) {
          volume = Math.min(100, Math.max(0, volume + dir * 4));
          if (player) { try { player.setVolume(volume); } catch (e) {} }
          click(); renderNowPlaying();
        }
        return;
      }
      if (!currentItems || !currentItems.length) return;
      click();
      setSel(Math.min(Math.max(getSel() + dir, 0), currentItems.length - 1));
    }
    function onCenter() {
      click();
      if (screen().kind === "nowPlaying") { togglePlay(); return; }
      var item = currentItems && currentItems[getSel()];
      if (item) item.action();
    }
    function onMenuBtn() { click(); pop(); }
    function onPrev() { click(); stepTrack(-1); }
    function onNext() { click(); stepTrack(1); }
    function onPlayPause() { click(); togglePlay(); }

    document.addEventListener("keydown", function (e) {
      if (e.key === "ArrowDown") { onScrollStep(1); e.preventDefault(); }
      else if (e.key === "ArrowUp") { onScrollStep(-1); e.preventDefault(); }
      else if (e.key === "Enter" || e.key === " ") { onCenter(); e.preventDefault(); }
      else if (e.key === "Escape" || e.key === "Backspace") { onMenuBtn(); e.preventDefault(); }
    });

    render();
    </script>
  </body>
</html>
